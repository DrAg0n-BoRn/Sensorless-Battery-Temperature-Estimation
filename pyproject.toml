[project]
name = "sensorless_battery_temperature_estimation"
version = "1.1.0"
description = "A project for estimating Li-ion cell battery surface temperature through historical temporal data."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "dragon-ml-toolbox[ml]==26.0.0",
]

[dependency-groups]
dev = [
    "jupytext>=1.19.1",
]

# Jupytext configuration
[tool.jupytext]
formats = "ipynb,md"
